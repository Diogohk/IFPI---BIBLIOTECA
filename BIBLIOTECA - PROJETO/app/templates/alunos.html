{% extends "base.html" %}
{% block title %}Cadastro de alunos | Biblioteca IFPI{% endblock %}
{% block content %}
<div class="form-page"><p class="eyebrow">CADASTROS • ALUNOS</p><h1>Cadastro de alunos</h1><p>Informe os dados do estudante.</p><form class="form-card" action="{{ url_for('alunos.cadastrar_aluno') }}" method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-group"><label for="matricula">Matrícula *</label><input id="matricula" name="matricula" required maxlength="20"></div><div class="form-group"><label for="nome">Nome completo *</label><input id="nome" name="nome" required maxlength="150"></div><div class="form-group"><label for="email">E-mail</label><input id="email" name="email" type="email" maxlength="254"></div><div class="form-group"><label for="telefone">Telefone</label><input id="telefone" name="telefone" maxlength="20"></div><div class="form-actions"><a href="{{ url_for('dashboard.inicio') }}">Voltar ao painel</a><button type="submit">Cadastrar aluno</button></div></form></div>
{% endblock %}
