<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de exemplar | Biblioteca IFPI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
  <script src="{{ url_for('static', filename='js/forms.js') }}" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Biblioteca IFPI · Campus Paulistana</p>
      <h1>Cadastro de exemplar</h1>
      <p>Registre uma unidade física de uma obra já cadastrada.</p>
    </header>
    <form class="form-card" data-demo-form>
      <div class="field">
        <label for="livro">Livro</label>
        <input id="livro" name="livro" type="text" placeholder="Informe o título ou identificador do livro" required>
      </div>
      <div class="field">
        <label for="codigo">Código de identificação do exemplar</label>
        <input id="codigo" name="codigo" type="text" maxlength="30" required>
      </div>
      <div class="field">
        <label for="estado">Estado do exemplar</label>
        <select id="estado" name="estado" required>
          <option value="">Selecione</option>
          <option value="disponivel">Disponível</option>
          <option value="emprestado">Emprestado</option>
          <option value="manutencao">Em manutenção</option>
        </select>
      </div>
      <div class="actions">
        <button type="reset" class="button button-secondary">Limpar</button>
        <button type="submit" class="button">Cadastrar exemplar</button>
      </div>
      <p class="feedback" role="status" aria-live="polite"></p>
    </form>
    <a class="back-link" href="{{ url_for('index') }}">Voltar ao início</a>
  </main>
</body>
</html>
