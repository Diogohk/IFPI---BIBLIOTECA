<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de livro | Biblioteca IFPI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
  <script src="{{ url_for('static', filename='js/forms.js') }}" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Biblioteca IFPI · Campus Paulistana</p>
      <h1>Cadastro de livro</h1>
      <p>Registre os dados bibliográficos da obra.</p>
    </header>
    <form class="form-card" data-demo-form>
      <div class="field">
        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" type="text" maxlength="200" required>
      </div>
      <div class="field">
        <label for="autor">Autor</label>
        <input id="autor" name="autor" type="text" maxlength="150" required>
      </div>
      <div class="field">
        <label for="isbn">ISBN</label>
        <input id="isbn" name="isbn" type="text" maxlength="20">
      </div>
      <div class="actions">
        <button type="reset" class="button button-secondary">Limpar</button>
        <button type="submit" class="button">Cadastrar livro</button>
      </div>
      <p class="feedback" role="status" aria-live="polite"></p>
    </form>
    <a class="back-link" href="{{ url_for('index') }}">Voltar ao início</a>
  </main>
</body>
</html>
