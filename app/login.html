
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Biblioteca IFPI</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <header class="logo">
                <span class="logo-icon" aria-hidden="true">📚</span>
                <h1>Biblioteca IFPI</h1>
                <p>Campus Paulistana</p>
            </header>

            <div class="welcome">
                <h2>Bem-vindo!</h2>
                <p>Entre com suas credenciais para acessar o sistema.</p>
            </div>

            <form id="loginForm" action="/login" method="POST">
                <div class="form-group">
                    <label for="usuario">Usuário ou matrícula</label>
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="password-container">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            id="toggleSenha"
                            class="toggle-password"
                            aria-label="Mostrar senha"
                            aria-pressed="false"
                        >Mostrar</button>
                    </div>
                </div>

                <button type="submit" class="login-button">Entrar no sistema</button>
            </form>

            <footer>
                <p>Sistema de Gerenciamento da Biblioteca</p>
                <span>IFPI – Campus Paulistana</span>
            </footer>
        </section>
    </main>

    <script src="../static/js/login.js"></script>
</body>
</html>
